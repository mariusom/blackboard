name: Release macOS DMG

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'SemVer release bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm (reads pnpm@12.11.2 from package.json#packageManager)
        uses: pnpm/action-setup@v4

      - name: Setup Node.js for pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify TypeScript types
        run: pnpm run typecheck

      - name: Verify Effect v4 language service diagnostics
        run: pnpm run check:effect

      - name: Run unit tests
        run: bun test

      - name: Bump SemVer version
        id: bump
        run: |
          NEW_VERSION=$(bun run scripts/bump-version.ts ${{ inputs.release_type }})
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "Bumped version to ${NEW_VERSION}"

      - name: Build standalone Bun executable
        run: bun run build

      - name: Generate macOS AppIcon.icns
        run: ./scripts/generate-icons.sh

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Package macOS Application & DMG
        run: |
          cargo packager --release --config packager.json || \
            cargo packager --release --config packager.json --formats app

      - name: Ensure macOS DMG artifact exists (with hdiutil fallback)
        id: dmg
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          DMG_FILE=$(find bundle -name "*.dmg" | head -n 1 || true)
          if [ -z "$DMG_FILE" ]; then
            echo "No DMG found in bundle directory. Attempting fallback via hdiutil..."
            APP_PATH=$(find bundle -name "*.app" | head -n 1 || true)
            if [ -n "$APP_PATH" ]; then
              echo "Ad-hoc signing ${APP_PATH} prior to hdiutil DMG creation..."
              xattr -cr "$APP_PATH"
              codesign --force --deep --sign - "$APP_PATH"
              DMG_FILE="bundle/Blackboard-${NEW_VERSION}.dmg"
              hdiutil create -volname "Blackboard" -srcfolder "$APP_PATH" -ov -format UDZO "$DMG_FILE"
              echo "Created DMG using hdiutil at ${DMG_FILE}"
            else
              echo "Error: Neither .dmg nor .app found in bundle directory!" >&2
              exit 1
            fi
          fi
          APP_PATH=$(find bundle -name "*.app" | head -n 1 || true)
          if [ -n "$APP_PATH" ]; then
            echo "Verifying .app bundle signature..."
            codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          fi
          echo "Ad-hoc signing DMG artifact..."
          xattr -cr "$DMG_FILE"
          codesign --force --sign - "$DMG_FILE"
          echo "path=${DMG_FILE}" >> $GITHUB_OUTPUT
          ls -lh "${DMG_FILE}"

      - name: Commit version bump and push git tag
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json packager.json
          git commit -m "chore(release): bump version to v${NEW_VERSION}"
          git tag -f "v${NEW_VERSION}"
          git push origin HEAD && git push origin "refs/tags/v${NEW_VERSION}" --force

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.bump.outputs.version }}
          DMG_PATH: ${{ steps.dmg.outputs.path }}
        run: |
          gh release create "v${NEW_VERSION}" "${DMG_PATH}" \
            --title "Blackboard v${NEW_VERSION}" \
            --generate-notes
